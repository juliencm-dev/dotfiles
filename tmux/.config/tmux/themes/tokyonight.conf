
# Tokyo Night Tmux Theme
# A clean, dark theme inspired by Tokyo Night for Neovim

color_bg="#1a1b26"
color_bg_dark="#16161e"
color_bg_highlight="#292e42"
color_terminal_black="#414868"
color_fg="#c0caf5"
color_fg_dark="#a9b1d6"
color_comment="#565f89"
color_blue="#7aa2f7"
color_cyan="#7dcfff"
color_green="#9ece6a"
color_magenta="#bb9af7"
color_orange="#ff9e64"
color_red="#f7768e"
color_yellow="#e0af68"
color_teal="#73daca"

icon_window="󰖯: "
powerline_left="\ue0ba"
powerline_right="\ue0bc"

# ── Status bar ──
set -g status-style "bg=$color_bg_dark,fg=$color_fg_dark"
set -g status-position top

# ── Left: session name in magenta ──
set -g status-left "\
#[bg=$color_magenta,fg=$color_bg,bold]  #S \
#[fg=$color_magenta,bg=$color_bg_dark]$powerline_right"
set -g status-left-length 60

# ── Windows ──
set -g status-justify left
setw -g window-status-separator ""

setw -g window-status-format "\
#[fg=$color_bg_highlight,bg=$color_bg_dark]$powerline_left\
#[bg=$color_bg_highlight,fg=$color_comment] $icon_window#I #W \
#[fg=$color_bg_highlight,bg=$color_bg_dark]$powerline_right"

setw -g window-status-current-format "\
#[fg=$color_blue,bg=$color_bg_dark]$powerline_left\
#[bg=$color_blue,fg=$color_bg_dark,bold] $icon_window#I #W \
#[fg=$color_blue,bg=$color_bg_dark]$powerline_right"

# ── Right: date & time ──
set -g status-right "\
#[fg=$color_bg_highlight,bg=$color_bg_dark]$powerline_left\
#[bg=$color_bg_highlight,fg=$color_teal]  %H:%M \
#[fg=$color_terminal_black,bg=$color_bg_highlight]$powerline_left\
#[bg=$color_terminal_black,fg=$color_cyan]  %b %d "
set -g status-right-length 60

# ── Pane borders ──
set -g pane-border-style "fg=$color_terminal_black"
set -g pane-active-border-style "fg=$color_blue"

# ── Messages ──
set -g message-style "bg=$color_bg_highlight,fg=$color_cyan,bold"
set -g message-command-style "bg=$color_bg_highlight,fg=$color_magenta"

# ── Mode (copy/selection) ──
setw -g mode-style "bg=$color_blue,fg=$color_bg_dark,bold"
