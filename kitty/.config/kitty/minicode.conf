# vim:ft=kitty

## name:     Minicode Monochrome
## author:   Custom warm monochrome theme
## license:  MIT
## blurb:    Minimal warm monochrome with tan accent shades

# The basic colors
foreground              #ddd9d5
background              #212121
selection_foreground    #212121
selection_background    #d0b495

# Cursor colors
cursor                  #d0b495
cursor_text_color       #212121

# URL underline color when hovering with mouse
url_color               #d0b495

# Kitty window border colors
active_border_color     #d0b495
inactive_border_color   #ac8252
bell_border_color       #bc9b75

# OS Window titlebar colors
wayland_titlebar_color  system
macos_titlebar_color    system

# Tab bar colors
active_tab_foreground   #212121
active_tab_background   #d0b495
inactive_tab_foreground #ac8252
inactive_tab_background #262626
tab_bar_background      #212121

# Colors for marks (marked text in the terminal)
mark1_foreground #212121
mark1_background #d0b495
mark2_foreground #212121
mark2_background #bc9b75
mark3_foreground #212121
mark3_background #ac8252

# The 16 terminal colors

# black
color0  #212121
color8  #ac8252

# red (using accent3 shade)
color1  #ac8252
color9  #ac8252

# green (using accent2 shade)
color2  #bc9b75
color10 #bc9b75

# yellow (using accent1 shade)
color3  #d0b495
color11 #d0b495

# blue (darker accent3 shade)
color4  #8a6b3d
color12 #8a6b3d

# magenta (muted accent2 shade)
color5  #a68a5f
color13 #a68a5f

# cyan (muted accent1 shade)
color6  #b9a87f
color14 #b9a87f

# white
color7  #ddd9d5
color15 #bc9b75
